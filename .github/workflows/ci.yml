name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile server
        run: javac --release 11 DakBoard.java

      - name: Unit tests (settings key scanner)
        run: |
          javac --release 11 -cp . -d . tests/SettingsKeysTest.java
          java -cp . SettingsKeysTest

      - name: Start server
        env:
          DAKBOARD_ADMIN_PASSWORD: ci-admin-password-12345
          DAKBOARD_EDITOR_PASSWORD: ci-editor-password-12345
        run: |
          nohup java DakBoard 8080 > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/event-board/login > /dev/null; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: HTTP regression tests
        shell: pwsh
        run: ./tests/settings-regression.ps1 -BaseUrl http://127.0.0.1:8080 -AdminPassword ci-admin-password-12345 -EditorPassword ci-editor-password-12345
