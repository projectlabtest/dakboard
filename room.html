<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIFE HOPE CENTER — Room Display</title>
<style>
  :root{
    --bg:linear-gradient(135deg,#e9a36b 0%,#d8b58b 30%,#8fb69b 60%,#789fbd 100%); --panel:#f5c48b; --panel-2:#b9d6b7; --text:#173b63;
    --muted:#315b7d; --line:#2f8f55; --accent:#1d5687; --success:#3f875f;
    --yellow:#2a6b9b; --red:#a9564e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
  body{font-family:Segoe UI,Arial,sans-serif}
  .room-screen{height:100%;padding:clamp(18px,3.5vmin,48px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(16px,2.5vmin,30px)}
  .room-header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;border-bottom:2px solid var(--line);padding-bottom:clamp(14px,2.5vmin,28px)}
  .brand{font-size:clamp(13px,2vmin,22px);font-weight:700;letter-spacing:clamp(2px,.5vmin,6px);color:var(--accent)}
  .eyebrow{margin-top:clamp(8px,1.6vmin,18px);font-size:clamp(11px,1.6vmin,18px);letter-spacing:2px;color:var(--muted)}
  .room-name{margin-top:4px;font-size:clamp(30px,6vmin,72px);line-height:1.05;color:var(--text)}
  .time-block{text-align:right;white-space:nowrap}
  .clock{font-size:clamp(40px,7vmin,86px);font-weight:700;line-height:1;color:var(--accent)}
  .date{margin-top:8px;font-size:clamp(14px,2.1vmin,25px);color:var(--muted)}
  .room-main{min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.8fr);gap:clamp(14px,2.5vmin,30px)}
  .panel{min-width:0;min-height:0;overflow:auto;border:2px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--panel),#e5a06c);padding:clamp(18px,3.5vmin,42px)}
  .primary{display:flex;flex-direction:column;justify-content:center;min-height:0;position:relative;overflow:hidden}
  #roomSlides{position:absolute;inset:0;display:none}
  .primary.showing-slides #roomSlides{display:block}
  .primary.showing-slides .meeting-title,
  .primary.showing-slides .range,
  .primary.showing-slides .meta{visibility:hidden}
  .room-slide{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-start;
    padding:clamp(18px,3.5vmin,42px);opacity:0;transition:opacity 1s;
    background-image:var(--photo);background-size:cover;background-position:center}
  .room-slide.active{opacity:1}
  .room-slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;pointer-events:none}
  body.portrait .room-slide video{object-fit:contain}
  .room-slide .caption{position:relative;z-index:2;background:rgba(23,59,99,.82);border:2px solid var(--line);
    padding:clamp(10px,1.8vmin,24px);border-radius:12px;max-width:70%}
  .room-slide .caption h2{font-size:clamp(22px,3.5vmin,40px);margin-bottom:6px;color:#fff4e8}
  .room-slide .caption p{font-size:clamp(12px,2.2vmin,22px);color:#fff4e8}
  .g1{background:linear-gradient(135deg,#e9a36b,#d8b58b)}
  .g2{background:linear-gradient(135deg,#8fb69b,#b9d6b7)}
  .g3{background:linear-gradient(135deg,#789fbd,#a9c9dc)}
  .primary.has-meeting{border-color:rgba(47,143,85,.95);box-shadow:0 0 0 2px rgba(47,143,85,.18),0 18px 60px rgba(0,0,0,.2)}
  .panel-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .panel-label{font-size:clamp(12px,1.7vmin,18px);font-weight:700;letter-spacing:1.5px;color:var(--muted)}
  .status-pill{display:inline-block;border-radius:999px;padding:clamp(5px,.8vmin,9px) clamp(10px,1.5vmin,18px);font-size:clamp(10px,1.3vmin,15px);font-weight:800;letter-spacing:.6px}
  .status-pill.available{background:rgba(49,91,125,.12);color:var(--muted)}
  .status-pill.ongoing{background:rgba(29,86,135,.18);color:var(--accent)}
  .status-pill.upcoming{background:rgba(42,107,155,.16);color:var(--yellow)}
  .meeting-title{margin-top:clamp(18px,3vmin,38px);font-size:clamp(34px,6.2vmin,76px);font-weight:800;line-height:1.12;overflow-wrap:anywhere}
  .range{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:clamp(8px,1.4vmin,18px);margin-top:clamp(22px,4vmin,48px)}
  .range-label{font-size:clamp(12px,1.7vmin,18px);font-weight:800;letter-spacing:1.1px;color:var(--accent)}
  .range-value{font-size:clamp(20px,3.2vmin,38px);font-weight:700;color:var(--text);overflow-wrap:anywhere}
  .range-arrow{font-size:clamp(16px,2.2vmin,26px);color:var(--accent)}
  .meta{margin-top:clamp(16px,2.5vmin,28px);font-size:clamp(14px,2.1vmin,24px);color:var(--muted)}
  .next-panel{display:flex;flex-direction:column;justify-content:center;min-height:0;background:linear-gradient(145deg,var(--panel-2),#a9c9dc)}
  .rundown-panel{justify-content:flex-start}
  .rundown-list{display:grid;margin-top:clamp(12px,2vmin,24px);max-height:clamp(240px,36vh,430px);overflow:auto}
  body.design-split .rundown-list{max-height:clamp(280px,44vh,520px)}
  .rundown-row{display:grid;grid-template-columns:minmax(74px,.55fr) minmax(0,1.4fr) minmax(96px,.85fr);align-items:center;gap:10px;border-top:2px solid var(--line);padding:10px 0}
  .rundown-row:first-child{border-top:0}
  .rundown-row.is-this-room{background:rgba(79,143,85,.12)}
  .rundown-time{font-size:clamp(12px,1.7vmin,18px);font-weight:800;color:var(--accent);overflow-wrap:anywhere}
  .rundown-name{min-width:0;font-size:clamp(14px,1.9vmin,22px);font-weight:700;overflow-wrap:anywhere}
  .rundown-room{display:flex;min-width:0;flex-direction:column;gap:3px;color:var(--text);font-size:clamp(13px,1.8vmin,21px);font-weight:700}
  .rundown-room-name{overflow-wrap:anywhere}
  .rundown-status{font-size:clamp(11px,1.3vmin,15px);font-weight:800;letter-spacing:.35px;color:var(--yellow)}
  .rundown-status.ongoing{color:var(--accent)}
  .ev-date{font-size:clamp(10px,1.35vmin,15px);font-weight:800;color:var(--muted);letter-spacing:.5px;margin:10px 0 2px}
  .ev-date:first-child{margin-top:0}
  .ev-row{padding:clamp(6px,1vmin,10px) 0;border-top:1px solid var(--line)}
  .ev-row.is-this-room{background:rgba(79,143,85,.12);border-left:3px solid var(--line);padding-left:7px;margin:3px 0}
  .ev-head{font-size:clamp(13px,1.8vmin,19px);font-weight:800;color:var(--accent)}
  .ev-badge{display:inline-block;margin-left:5px;padding:1px 5px;border-radius:4px;font-size:clamp(9px,1.1vmin,12px);
    letter-spacing:.4px;background:rgba(42,107,155,.16);color:var(--yellow);vertical-align:middle}
  .ev-badge.ongoing{background:rgba(47,143,85,.18);color:var(--success)}
  .ev-title{font-size:clamp(14px,1.9vmin,21px);font-weight:700;overflow-wrap:anywhere}
  .ev-loc{color:var(--muted);font-size:clamp(11px,1.4vmin,15px);font-weight:700;overflow-wrap:anywhere}
  .upcoming-panel{min-width:0;border:2px solid var(--line);border-radius:18px;background:rgba(255,230,193,.88);padding:clamp(14px,2.2vmin,28px)}
  .room-message-panel{display:flex;min-height:0;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .room-status-label{margin-bottom:clamp(6px,1vmin,12px);font-size:clamp(12px,1.7vmin,20px);font-weight:800;letter-spacing:1.5px;color:var(--muted)}
  .room-message-panel.has-meeting{border-color:rgba(47,143,85,.95);box-shadow:0 0 0 2px rgba(47,143,85,.14)}
  .room-message{font-size:clamp(28px,5.5vmin,68px);font-weight:800;letter-spacing:1px;color:var(--accent)}
  .room-message.ongoing{color:var(--accent)}
  .room-message.available{color:var(--accent)}
  .room-message-detail{margin-top:8px;font-size:clamp(15px,2.2vmin,26px);font-weight:700;color:var(--text)}
  .empty{padding:clamp(12px,2vmin,24px) 0;color:var(--muted);font-size:clamp(12px,1.7vmin,20px)}
  .weather-mini{margin-top:6px;font-size:clamp(13px,1.7vmin,21px);font-weight:700;color:var(--accent)}
  .footer{text-align:center;color:var(--muted);font-size:clamp(11px,1.4vmin,16px);letter-spacing:.8px}
  body.portrait .room-screen{max-width:1100px;margin:0 auto}
  body.portrait .room-header{align-items:flex-start}
  body.portrait .room-main{grid-template-columns:1fr;grid-template-rows:minmax(0,1.2fr) minmax(0,.8fr)}
  body.design-split.portrait .room-main{grid-template-columns:minmax(0,1.35fr) minmax(280px,.8fr);grid-template-rows:minmax(0,1fr)}
  body.portrait .primary{min-height:0}
  body.portrait .room-slide .caption{max-width:90%}
  body.portrait .next-panel{min-height:0}
  @media(max-width:800px){
    html,body{height:auto;overflow:auto}
    .room-screen{height:auto;min-height:100vh;min-height:100dvh;padding:16px;gap:16px}
     .room-header{gap:12px}
     .room-name{font-size:clamp(28px,8vw,50px)}
     .clock{font-size:clamp(34px,9vw,60px)}
     .date{font-size:14px}
     .room-main{grid-template-columns:1fr;grid-template-rows:auto auto}
      .primary{min-height:360px}
      .room-slide .caption{max-width:90%}
     .next-panel{min-height:220px}
     .room-message{font-size:clamp(26px,9vw,52px)}
  }
</style>
</head>
<body>
<div class="room-screen">
  <header class="room-header">
    <div>
      <div class="brand">LIFE HOPE CENTER</div>
      <div class="eyebrow">ROOM DISPLAY</div>
      <h1 class="room-name" id="roomName">ROOM NOT SELECTED</h1>
    </div>
    <div class="time-block">
      <div class="clock" id="clock">--:--</div>
      <div class="weather-mini" id="weather">⏳ Loading weather...</div>
      <div class="date" id="date">...</div>
    </div>
  </header>

  <main class="room-main">
     <section class="panel primary" id="currentPanel">
       <h2 class="meeting-title" id="currentTitle">Room is available</h2>
      <div class="range" id="currentRange"></div>
      <div class="meta" id="currentMeta">No upcoming meeting</div>
      <div id="roomSlides"></div>
    </section>

    <section class="panel next-panel rundown-panel">
      <div class="panel-top">
        <div class="panel-label" id="rundownLabel">EVENT RUNDOWN</div>
        <div class="upcoming-count" id="rundownCount">0 scheduled</div>
      </div>
      <div class="rundown-list" id="rundownList"></div>
    </section>
  </main>

  <section class="upcoming-panel room-message-panel" id="roomMessagePanel">
       <div class="room-status-label">ROOM STATUS</div>
       <div class="room-message" id="roomMessage">AVAILABLE ROOM</div>
       <div class="room-message-detail" id="roomMessageDetail">No meeting currently in this room</div>
     </section>

  <footer class="footer">START AND END TIMES ARE SHOWN IN ASIA/MANILA TIME</footer>
</div>
<script>
const DEFAULT_ROOMS = [
  {name:"Convention Hall", location:"Convention Hall"},
  {name:"Conference Room 1", location:"Conference Room 1"},
  {name:"Conference Room 2", location:"Conference Room 2"},
  {name:"Executive Room", location:"Executive Room"},
  {name:"Board Room", location:"Board Room"}
];
const query = new URLSearchParams(location.search);
const roomQuery = (query.get("room") || "").trim();
let settings = {rooms:[]};
let roomConfig = null;
let currentEvents = [];
let lastSettings = "";
let lastRoomHtml = "";
let lastPhotos = "";
document.body.classList.toggle("portrait", query.get("orientation") === "portrait");

function tick(){
  const now = new Date();
  document.getElementById("clock").textContent = new Intl.DateTimeFormat("en-PH", {
    timeZone:"Asia/Manila", hour:"numeric", minute:"2-digit", hour12:true
  }).format(now);
  document.getElementById("date").textContent = new Intl.DateTimeFormat("en-PH", {
    timeZone:"Asia/Manila", weekday:"long", month:"long", day:"numeric", year:"numeric"
  }).format(now);
}

async function loadWeather(){
  try{
    const lat = Number(settings.weatherLat) || 14.2306;
    const lon = Number(settings.weatherLon) || 120.9750;
    const u = "https://api.open-meteo.com/v1/forecast?latitude=" + lat +
      "&longitude=" + lon + "&current=temperature_2m,weather_code&timezone=Asia%2FManila";
    const r = await fetch(u); const j = await r.json();
    const t = Math.round(j.current.temperature_2m);
    const code = j.current.weather_code;
    const desc = {0:"Clear ☀️",1:"Mostly clear ⛅",2:"Partly cloudy ⛅",3:"Overcast ☁️",
      45:"Foggy 🌫️",48:"Foggy 🌫️",51:"Drizzle 🌦️",53:"Drizzle 🌦️",55:"Drizzle 🌦️",
      56:"Freezing drizzle 🧊",57:"Freezing drizzle 🧊",
      61:"Rain 🌧️",63:"Rain 🌧️",65:"Heavy rain 🌧️",66:"Freezing rain 🧊",67:"Freezing rain 🧊",
      71:"Snow 🌨️",73:"Snow 🌨️",75:"Heavy snow 🌨️",77:"Snow grains 🌨️",
      80:"Rain showers 🌦️",81:"Rain showers 🌦️",82:"Heavy showers 🌧️",
      85:"Snow showers 🌨️",86:"Snow showers 🌨️",
      95:"Thunderstorm ⛈️",96:"Thunderstorm ⛈️",99:"Thunderstorm ⛈️"}[code] || "Weather code " + code;
    document.getElementById("weather").textContent = "🌡️ Silang " + t + "°C — " + desc;
  }catch(e){
    document.getElementById("weather").textContent = "🌡️ Weather offline — check internet";
  }
}

function normalizeRoomName(value){
  return String(value || "").trim().replace(/\s+/g, " ").toLowerCase();
}

function stripOrgTag(value){
  return String(value || "").replace(/^lhc\s+/, "").replace(/\s*\(lhc\)\s*$/, "").trim();
}

function roomWords(value){
  return stripOrgTag(normalizeRoomName(value)).split(" ").filter(w => w);
}

function wordsMatch(shorter, longer){
  if(!shorter.length || !longer.length) return false;
  let j = 0;
  for(let i = 0; i < longer.length && j < shorter.length; i++){
    if(longer[i] === shorter[j]) j++;
  }
  return j === shorter.length;
}

function eventInRoom(event, room){
  if(!event || !room) return false;
  const wanted = [room.location || room.name, room.name].map(roomWords);
  const parts = String(event.location || "").split(";").map(roomWords).filter(p => p.length);
  return parts.some(p => wanted.some(w => wordsMatch(w, p) || wordsMatch(p, w)));
}

function roomEntries(){
  const rooms = Array.isArray(settings.rooms) ? settings.rooms : DEFAULT_ROOMS;
  return rooms.map(room => {
    if(typeof room === "string") return {name:room.trim(), location:room.trim()};
    if(room && typeof room === "object" && typeof room.name === "string"){
      return {name:room.name.trim(), location:String(room.location || room.name).trim()};
    }
    return null;
  }).filter(room => room && room.name);
}

function resolveRoomConfig(value){
  const wanted = normalizeRoomName(value);
  const rooms = roomEntries();
  const contains = (candidate) => Boolean(wanted) && candidate &&
    (candidate.includes(wanted) || wanted.includes(candidate));
  return rooms.find(room => normalizeRoomName(room.name) === wanted)
    || rooms.find(room => normalizeRoomName(room.location) === wanted)
    || rooms.find(room => contains(normalizeRoomName(room.name))
      || contains(normalizeRoomName(room.location)))
    || {name:String(value || "").trim(), location:String(value || "").trim()};
}

function brandForRoom(room){
  const text = ((room && room.name) || "") + " " + ((room && room.location) || "");
  if(/ssd/i.test(text)) return {header:"SOUTHERN ASIA-PACIFIC DIVISION", title:"Southern Asia-Pacific Division — Room Display"};
  return {header:"LIFE HOPE CENTER", title:"LIFE HOPE CENTER — Room Display"};
}

function eventStatus(event){
  const start = Date.parse(event && event.start || "");
  const end = Date.parse(event && event.end || "");
  const now = Date.now();
  if(Number.isFinite(start) && Number.isFinite(end)){
    if(now >= end) return "ended";
    if(now >= start) return "ongoing";
  }
  return "upcoming";
}

function eventsForRoom(){
  if(!roomConfig) return [];
  return currentEvents.filter(event => event
    && typeof event.location === "string"
    && eventInRoom(event, roomConfig)
    && eventStatus(event) !== "ended")
    .sort((a, b) => Date.parse(a.start || 0) - Date.parse(b.start || 0));
}

function formatDate(value){
  return new Intl.DateTimeFormat("en-PH", {
    timeZone:"Asia/Manila", weekday:"short", month:"short", day:"numeric"
  }).format(new Date(value));
}

function formatTime(value){
  return new Intl.DateTimeFormat("en-PH", {
    timeZone:"Asia/Manila", hour:"numeric", minute:"2-digit", hour12:true
  }).format(new Date(value));
}

function sameManilaDate(first, second){
  const options = {timeZone:"Asia/Manila", year:"numeric", month:"2-digit", day:"2-digit"};
  return new Intl.DateTimeFormat("en-CA", options).format(new Date(first))
    === new Intl.DateTimeFormat("en-CA", options).format(new Date(second));
}

function momentLabel(value, other){
  const time = formatTime(value);
  return sameManilaDate(value, other) ? time : formatDate(value) + " " + time;
}

function addRangePart(container, label, value){
  const labelEl = document.createElement("span");
  labelEl.className = "range-label";
  labelEl.textContent = label;
  const valueEl = document.createElement("span");
  valueEl.className = "range-value";
  valueEl.textContent = value;
  container.append(labelEl, valueEl);
}

function setRange(container, event){
  container.replaceChildren();
  if(!event){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No meeting scheduled";
    container.appendChild(empty);
    return;
  }
  if(event.allDay){
    addRangePart(container, "START DATE", formatDate(event.start));
    addRangePart(container, "END DATE", formatDate(event.end));
  }else{
    addRangePart(container, "START TIME", momentLabel(event.start, event.end));
    addRangePart(container, "END TIME", momentLabel(event.end, event.start));
  }
}

function setMeta(element, event){
  if(!event){
    element.textContent = "Waiting for schedule";
    return;
  }
  element.textContent = (event.day || formatDate(event.start)) + (event.location ? "  •  " + event.location : "");
}

function scheduledEvents(){
  return currentEvents
    .filter(event => event && eventStatus(event) !== "ended")
    .sort((a, b) => Date.parse(a.start || 0) - Date.parse(b.start || 0));
}

function isSameManilaDay(a, b){
  try{ return sameManilaDate(a, b); }catch(e){ return false; }
}

function manilaDateKey(){
  const parts = new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Manila",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const values = {};
  parts.forEach(p => { if(p.type !== "literal") values[p.type] = p.value; });
  return values.year+"-"+values.month+"-"+values.day;
}

function renderRundownClassic(events){
  const rundown = document.getElementById("rundownList");
  const count = document.getElementById("rundownCount");
  const label = document.getElementById("rundownLabel");
  rundown.replaceChildren();
  const todays = events.filter(e => eventStatus(e) === "ongoing" || isSameManilaDay(e.start, Date.now()));
  let title, list;
  if(todays.length){
    title = "TODAY'S MEETING";
    list = todays;
  }else{
    const tomorrow = new Date(Date.now() + 24 * 60 * 60 * 1000);
    const tmrs = events.filter(e => isSameManilaDay(e.start, tomorrow));
    if(tmrs.length){
      title = "TOMORROW'S MEETING";
      list = tmrs;
    }else{
      title = "UPCOMING MEETINGS";
      list = events;
    }
  }
  if(label) label.textContent = title;
  count.textContent = list.length + " scheduled";
  if(!list.length){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No upcoming meetings";
    rundown.appendChild(empty);
    return;
  }
  list.slice(0, 6).forEach(event => {
    const statusValue = eventStatus(event);
    const currentRoom = roomConfig && eventInRoom(event, roomConfig);
    const row = document.createElement("div");
    row.className = "rundown-row" + (currentRoom ? " is-this-room" : "");
    const time = document.createElement("div");
    time.className = "rundown-time";
    time.textContent = event.allDay ? "ALL DAY" : (event.time || momentLabel(event.start, event.end));
    const name = document.createElement("div");
    name.className = "rundown-name";
    name.textContent = event.title || "Untitled meeting";
    const room = document.createElement("div");
    room.className = "rundown-room";
    const roomName = document.createElement("span");
    roomName.className = "rundown-room-name";
    roomName.textContent = (currentRoom ? "THIS ROOM · " : "") + (event.location || "Unassigned");
    const status = document.createElement("span");
    status.className = "rundown-status " + (statusValue === "ongoing" ? "ongoing" : "upcoming");
    status.textContent = statusValue === "ongoing" ? "ON-GOING" : "UPCOMING";
    room.append(roomName, status);
    row.append(time, name, room);
    rundown.appendChild(row);
  });
}

function renderRundown(events){
  if((settings.outputDesign || "classic") !== "split"){
    renderRundownClassic(events);
    return;
  }
  const rundown = document.getElementById("rundownList");
  const count = document.getElementById("rundownCount");
  const label = document.getElementById("rundownLabel");
  rundown.replaceChildren();
  const todays = events.filter(e => eventStatus(e) === "ongoing" || isSameManilaDay(e.start, Date.now()));
  let title, list;
  if(todays.length){
    title = "TODAY'S MEETING";
    list = todays;
  }else{
    const tomorrow = new Date(Date.now() + 24 * 60 * 60 * 1000);
    const tmrs = events.filter(e => isSameManilaDay(e.start, tomorrow));
    if(tmrs.length){
      title = "TOMORROW'S MEETING";
      list = tmrs;
    }else{
      title = "UPCOMING MEETINGS";
      list = events;
    }
  }
  if(label) label.textContent = title;
  count.textContent = list.length + " scheduled";
  if(!list.length){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No upcoming meetings";
    rundown.appendChild(empty);
    return;
  }
  const today = manilaDateKey();
  let lastDate = "";
  list.slice(0, 8).forEach(event => {
    if(event.date && event.date !== lastDate){
      const date = document.createElement("div");
      date.className = "ev-date";
      date.textContent = (event.date === today ? "TODAY • " : "") + (event.day || formatDate(event.start));
      rundown.appendChild(date);
      lastDate = event.date;
    }
    const statusValue = eventStatus(event);
    const currentRoom = roomConfig && eventInRoom(event, roomConfig);
    const row = document.createElement("div");
    row.className = "ev-row" + (currentRoom ? " is-this-room" : "");
    const head = document.createElement("div");
    head.className = "ev-head";
    head.textContent = event.allDay ? "ALL DAY" : (event.time || momentLabel(event.start, event.end));
    const badge = document.createElement("span");
    badge.className = "ev-badge" + (statusValue === "ongoing" ? " ongoing" : "");
    badge.textContent = statusValue === "ongoing" ? "ON-GOING" : "UPCOMING";
    head.appendChild(document.createTextNode(" "));
    head.appendChild(badge);
    const name = document.createElement("div");
    name.className = "ev-title";
    name.textContent = event.title || "Untitled meeting";
    const loc = document.createElement("div");
    loc.className = "ev-loc";
    loc.textContent = (currentRoom ? "THIS ROOM · " : "") + (event.location || "Unassigned");
    row.append(head, name, loc);
    rundown.appendChild(row);
  });
}

function renderRoomMessage(ongoing, next, prepare){
  const panel = document.getElementById("roomMessagePanel");
  const message = document.getElementById("roomMessage");
  const detail = document.getElementById("roomMessageDetail");
  panel.classList.toggle("has-meeting", !!ongoing);
  if(ongoing){
    message.className = "room-message ongoing";
    message.textContent = "ON-GOING MEETING";
    detail.textContent = "PLEASE KEEP SILENT";
  }else if(prepare && next){
    message.className = "room-message upcoming";
    message.textContent = "GET READY";
    detail.textContent = "Upcoming: " + (next.title || "Untitled meeting") + " at " + momentLabel(next.start, next.end);
  }else{
    message.className = "room-message available";
    message.textContent = "AVAILABLE ROOM";
    detail.textContent = "No meeting currently in this room";
  }
}

function render(){
  const list = eventsForRoom();
  const ongoing = list.find(event => eventStatus(event) === "ongoing");
  const upcoming = list.filter(event => eventStatus(event) === "upcoming");
  const next = upcoming[0] || null;
  const PREPARE_MS = 2 * 60 * 60 * 1000;
  const nextStart = next ? Date.parse(next.start || "") : NaN;
  const prepare = !ongoing && !!next && Number.isFinite(nextStart) && (nextStart - Date.now()) <= PREPARE_MS;
   const currentPanel = document.getElementById("currentPanel");
   const currentTitle = document.getElementById("currentTitle");
   const currentMeta = document.getElementById("currentMeta");
   currentPanel.classList.toggle("has-meeting", !!ongoing);
   currentPanel.classList.toggle("showing-slides", !ongoing && !prepare && roomHasSlides);
  if(ongoing){
    currentTitle.textContent = ongoing.title || "Untitled meeting";
    setRange(document.getElementById("currentRange"), ongoing);
    setMeta(currentMeta, ongoing);
  }else if(prepare){
    currentTitle.textContent = next.title || "Untitled meeting";
    setRange(document.getElementById("currentRange"), next);
    currentMeta.textContent = "Starts " + momentLabel(next.start, next.end) + " — Please prepare the room";
  }else{
    currentTitle.textContent = "Room is available";
    setRange(document.getElementById("currentRange"), null);
    currentMeta.textContent = next ? "Next: " + (next.title || "Untitled meeting") : "No upcoming meeting";
  }
  renderRoomMessage(ongoing, next, prepare);
  renderRundown(scheduledEvents());
}

async function fetchSettings(){
  try{
    const response = await fetch("/api/lhc-events-board/settings?ts=" + Date.now(), {cache:"no-store"});
    if(!response.ok) return null;
    const text = await response.text();
    try{ settings = JSON.parse(text); }catch(e){}
    return text;
  }catch(e){ return null; }
}

async function loadEvents(){
  try{
    const response = await fetch("/api/lhc-events-board/events?ts=" + Date.now(), {cache:"no-store"});
    if(!response.ok) return;
    const data = await response.json();
    currentEvents = Array.isArray(data) ? data : [];
    render();
  }catch(e){}
}

// Slideshow (same photos and announcements as the main board).
// Shown in the main panel whenever this room has no on-going meeting.
let roomHasSlides = false;
let roomSlidesTimer = null;

async function loadRoomSlides(){
  const box = document.getElementById("roomSlides");
  let photos = [];
  try{
    const response = await fetch("/api/lhc-events-board/photos");
    if(response.ok) photos = await response.json();
  }catch(e){}
  const porder = (settings.photoOrder && settings.photoOrder.length) ? settings.photoOrder : null;
  if(porder){
    const pos = {};
    porder.forEach((name, i) => { pos[name] = i; });
    photos = photos.slice().sort((a, b) => {
      const na = a.substring(a.lastIndexOf("/") + 1), nb = b.substring(b.lastIndexOf("/") + 1);
      const pa = (na in pos) ? pos[na] : 1e9, pb = (nb in pos) ? pos[nb] : 1e9;
      return (pa - pb) || (na < nb ? -1 : na > nb ? 1 : 0);
    });
  }
  box.innerHTML = "";
  const anns = Array.isArray(settings.announcements) && settings.announcements.length ? settings.announcements : [];
  const grads = ["g1", "g2", "g3"];
  const photoAnns = settings.photoAnnouncements || {};
  const usedAnns = new Set();
  const slides = photos.map(src => {
    const name = src.substring(src.lastIndexOf("/") + 1);
    const ai = Number(photoAnns[name]);
    const ann = (Number.isInteger(ai) && ai >= 0 && ai < anns.length) ? anns[ai] : null;
    if(ann) usedAnns.add(ai);
    return {img:src, title:ann ? (ann.title || "") : "", sub:ann ? (ann.sub || "") : ""};
  });
  anns.forEach((a, i) => {
    if(!usedAnns.has(i)) slides.push({cls:grads[i % grads.length], title:(a.title || ""), sub:(a.sub || "")});
  });
  slides.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "room-slide" + (i === 0 ? " active" : "");
    if(s.img){
      if(isVideoFile(s.img)){
        const video = document.createElement("video");
        video.muted = true; video.playsInline = true; video.preload = "auto";
        video.src = s.img;
        d.appendChild(video);
      }else{
        d.style.setProperty("--photo", "url('" + s.img + "')");
      }
    }
    else d.classList.add(s.cls);
    if(s.title || s.sub){
      const cap = document.createElement("div");
      cap.className = "caption";
      if(s.title){
        const h = document.createElement("h2");
        h.textContent = s.title;
        cap.appendChild(h);
      }
      if(s.sub){
        const p = document.createElement("p");
        p.textContent = s.sub;
        cap.appendChild(p);
      }
      d.appendChild(cap);
    }
    box.appendChild(d);
  });
  roomHasSlides = slides.length > 0;
  if(roomSlidesTimer) clearTimeout(roomSlidesTimer);
  let cur = 0;
  function showRoomSlide(i){
    const all = box.querySelectorAll(".room-slide");
    if(!all.length) return;
    all.forEach(s => {
      s.classList.remove("active");
      const v = s.querySelector("video");
      if(v){ try{ v.pause(); }catch(e){} v.onended = null; }
    });
    cur = ((i % all.length) + all.length) % all.length;
    const active = all[cur];
    active.classList.add("active");
    let wait = (settings.slideSeconds || 10) * 1000;
    const video = active.querySelector("video");
    if(video){
      try{ video.currentTime = 0; }catch(e){}
      try{ const p = video.play(); if(p && typeof p.catch === "function") p.catch(()=>{}); }catch(e){}
      const dur = video.duration;
      if(Number.isFinite(dur) && dur > 0) wait = Math.min(Math.max(dur * 1000, 1000), 60000);
      video.onended = () => { clearTimeout(roomSlidesTimer); showRoomSlide(cur + 1); };
    }
    roomSlidesTimer = setTimeout(() => showRoomSlide(cur + 1), wait);
  }
  showRoomSlide(0);
  render();
}

function isVideoFile(src){
  const n = String(src || "").toLowerCase();
  return n.endsWith(".mp4") || n.endsWith(".webm");
}

async function fetchRoomHtml(){
  try{
    const url = new URL(location.href);
    url.searchParams.set("tv", Date.now());
    const response = await fetch(url, {cache:"no-store"});
    return response.ok ? await response.text() : null;
  }catch(e){ return null; }
}

async function checkSettings(){
  const html = await fetchRoomHtml();
  if(html !== null){
    if(lastRoomHtml && html !== lastRoomHtml){
      location.reload();
      return;
    }
    lastRoomHtml = html;
  }
  const text = await fetchSettings();
  if(text !== null && lastSettings && text !== lastSettings){
    location.reload();
    return;
  }
  if(text !== null) lastSettings = text;
  try{
    const response = await fetch("/api/lhc-events-board/photos?ts=" + Date.now(), {cache:"no-store"});
    if(response.ok){
      const photosText = await response.text();
      if(lastPhotos && photosText !== lastPhotos){
        location.reload();
        return;
      }
      lastPhotos = photosText;
    }
  }catch(e){}
}

async function boot(){
  tick();
  setInterval(tick, 1000);
  const text = await fetchSettings();
  if(text !== null) lastSettings = text;
  document.body.classList.toggle("design-split", settings.outputDesign === "split");
  roomConfig = roomQuery ? resolveRoomConfig(roomQuery) : null;
  const brand = brandForRoom(roomConfig);
  document.querySelector(".brand").textContent = brand.header;
  document.title = brand.title;
  document.getElementById("roomName").textContent = roomConfig && roomConfig.name
    ? roomConfig.name : "ROOM NOT SELECTED";
  loadWeather();
  setInterval(loadWeather, 10 * 60 * 1000);
  await loadEvents();
  await loadRoomSlides();
  const html = await fetchRoomHtml();
  if(html !== null) lastRoomHtml = html;
  try{
    const response = await fetch("/api/lhc-events-board/photos?ts=" + Date.now(), {cache:"no-store"});
    if(response.ok) lastPhotos = await response.text();
  }catch(e){}
  setInterval(loadEvents, 30000);
  setInterval(checkSettings, 2000);
  window.addEventListener("focus", checkSettings);
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden) checkSettings();
  });
}

boot();
