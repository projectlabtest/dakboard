<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIFE HOPE CENTER — LHC Events Board</title>
<style>
  /* EDIT HERE: change colors / branding */
  :root{
    --bg:linear-gradient(135deg,#e9a36b 0%,#d8b58b 30%,#8fb69b 60%,#789fbd 100%); --card:#f5c48b; --text:#173b63; --muted:#315b7d;
    --accent:#1d5687; --green:#2f8f55; --yellow:#2a6b9b; --line:#2f8f55; --rundown-text:#315b7d;
    --edge:clamp(12px,2.2vmin,28px);
    --gap:clamp(8px,1.6vmin,18px);
    --ticker-h:clamp(40px,8vmin,72px);
    --slide-pad:clamp(16px,3.2vmin,48px);
  }
  body.theme-dark{--bg:linear-gradient(135deg,#0d1f33 0%,#16324e 60%,#1d3f5c 100%);--card:#1c3448;--text:#f2e9d8;--muted:#cfc4a8;
    --accent:#8fc0e8;--green:#5da87e;--yellow:#8fc0e8;--line:#3f7a52;--rundown-text:#e8dcc2}
  body.theme-dark .left{background:linear-gradient(180deg,rgba(24,44,68,.96),rgba(16,30,46,.96))}
  body.theme-dark .weather{background:rgba(30,52,78,.78);color:#f2e9d8}
  body.theme-dark .verse{background:rgba(28,62,48,.8);color:#f2e9d8}
  body.theme-dark .cal{background:rgba(30,52,78,.78)}
  body.theme-dark .ticker{background:rgba(16,30,46,.92)}
  body.theme-dark .slide-fit{background-color:#060d16}
  body.theme-dark .events-date,body.theme-dark .ev,body.theme-dark .ev b,body.theme-dark .ev.today b,body.theme-dark .ev .loc,body.theme-dark .ev-name{color:#f2e9d8}
  html{height:100%}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
    font-family:Segoe UI,Arial,sans-serif;width:100%;min-width:0;height:100vh;height:100dvh;overflow:hidden}
  .grid{display:grid;grid-template-columns:clamp(230px,26vw,420px) minmax(0,1fr);
    grid-template-rows:minmax(0,1fr) var(--ticker-h);width:100%;height:100vh;height:100dvh;min-width:0;min-height:0}
  .left{background:linear-gradient(180deg,rgba(245,196,139,.96),rgba(229,160,108,.96));padding:var(--edge);display:flex;
    flex-direction:column;gap:var(--gap);border-right:2px solid var(--line);min-width:0;min-height:0;overflow:hidden}
  .clock{font-size:clamp(40px,5vmin,84px);font-weight:700;line-height:1}
  .date{font-size:clamp(13px,1.8vmin,22px);color:var(--muted)}
  .weather{font-size:clamp(16px,2.1vmin,27px);background:rgba(255,230,193,.72);border-radius:12px;padding:clamp(8px,1.5vmin,16px)}
  .verse{background:rgba(185,214,183,.78);border-left:4px solid var(--green);
    border-radius:8px;padding:clamp(8px,1.5vmin,16px);font-size:clamp(14px,2.1vmin,23px);font-style:italic}
  .verse b{display:block;margin-top:8px;font-style:normal;
    color:var(--green);font-size:clamp(11px,1.6vmin,17px)}
  .cal{background:rgba(255,230,193,.78);border-radius:12px;padding:clamp(8px,1.5vmin,16px)}
  .cal h3{font-size:clamp(11px,1.5vmin,16px);color:var(--rundown-text);font-weight:800;margin-bottom:clamp(4px,1vmin,8px);
    letter-spacing:1px}
  .main{position:relative;overflow:hidden;background:var(--bg);min-width:0;min-height:0}
  .slide{position:absolute;inset:0;display:flex;align-items:flex-end;
    justify-content:flex-start;padding:var(--slide-pad);opacity:0;
    transition:opacity 1s;background-image:var(--photo);background-size:cover;
    background-position:center;isolation:isolate}
  .slide-fit{background-image:none;background-color:#0f2740}
  .slide.active{opacity:1}
  .slide::before{content:"";display:block;position:absolute;inset:-6%;background-image:var(--photo);
    background-size:cover;background-position:center;filter:blur(clamp(12px,2.2vmin,28px));
    opacity:.65;z-index:0;pointer-events:none}
  .slide.slide-cover::before{display:none}
  .slide .slide-photo{display:block;position:absolute;inset:0;background-image:var(--photo);
    background-size:contain;background-repeat:no-repeat;background-position:center;
    z-index:1;pointer-events:none}
  .slide.slide-cover .slide-photo{display:none}
  .slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;pointer-events:none}
  body.portrait .slide video{object-fit:contain}
  .slide .caption{position:relative;z-index:2;background:rgba(23,59,99,.82);border:2px solid var(--line);padding:clamp(10px,1.8vmin,24px);
    border-radius:12px;max-width:70%}
  .slide .caption h2{font-size:clamp(22px,3.5vmin,40px);margin-bottom:6px;color:#fff4e8}
  .slide .caption p{font-size:clamp(12px,2.2vmin,22px);color:#fff4e8}
  .portrait .slide .caption h2{font-size:clamp(24px,7vmin,38px)}
  body.portrait .slide{background-size:contain;background-position:center;background-repeat:no-repeat;background-color:var(--bg)}
  body.portrait .slide::before{display:block;background-size:cover;background-position:center;background-repeat:no-repeat}
  body.portrait .slide .slide-photo{display:block;position:absolute;inset:0;background-image:var(--photo);
    background-size:contain;background-position:center;background-repeat:no-repeat;z-index:1;pointer-events:none}
  /* default gradients when no photo */
  .g1{background:linear-gradient(135deg,#e9a36b,#d8b58b)}
  .g2{background:linear-gradient(135deg,#8fb69b,#b9d6b7)}
  .g3{background:linear-gradient(135deg,#789fbd,#a9c9dc)}
  .ticker{grid-column:1/3;background:rgba(143,181,209,.9);display:flex;
    align-items:center;overflow:hidden;border-top:2px solid var(--line);min-width:0;
    font-size:clamp(12px,1.8vmin,24px);font-weight:700}
  body:not(.portrait) .ticker{font-size:clamp(13px,2vmin,26px)}
  .ticker span{white-space:nowrap;padding-left:100%;
    animation:scroll 30s linear infinite}
  @keyframes scroll{to{transform:translateX(-100%)}}
  .events-date{font-size:clamp(10px,1.35vmin,14px);font-weight:800;color:#1e3f5c;margin:5px 0 2px;letter-spacing:.5px}
  .ev{padding:clamp(4px,1vmin,9px) 0;border-top:1px solid var(--line);font-size:clamp(13px,1.8vmin,18px);font-weight:700;color:#1e3f5c}
  .ev:first-child{border-top:0}
  .ev b{color:#1e3f5c;font-size:clamp(11px,1.5vmin,16px);font-weight:800}
  .ev .loc{color:#1e3f5c;font-size:clamp(10px,1.3vmin,14px);font-weight:800}
  .ev.today{background:rgba(29,86,135,.12);border-left:3px solid var(--green);padding-left:7px;margin:3px 0}
  .ev.today b{color:#1e3f5c}
  .ev-today{display:inline-block;margin-left:5px;padding:1px 4px;border-radius:4px;background:var(--green);color:var(--rundown-text);font-size:clamp(7px,.9vmin,10px)}
  .ev-name{font-weight:800;color:#1e3f5c;font-size:clamp(13px,1.8vmin,19px);overflow-wrap:anywhere}
  .room-info{border:1px solid var(--line);border-radius:8px;padding:clamp(6px,1.2vmin,12px);margin-bottom:8px;background:rgba(255,230,193,.78)}
  .room-kicker{font-size:clamp(9px,1.25vmin,14px);color:var(--rundown-text);font-weight:700;letter-spacing:1px}
  .room-name{font-size:clamp(18px,2.7vmin,31px);font-weight:800;color:var(--rundown-text);margin:2px 0 5px}
  .room-state{display:inline-block;padding:2px 6px;border-radius:4px;font-size:clamp(9px,1.2vmin,13px);font-weight:700;letter-spacing:.5px}
  .room-state.ongoing,.ev-status.ongoing{background:rgba(47,143,85,.18);color:var(--green)}
  .room-state.upcoming,.ev-status.upcoming{background:rgba(42,107,155,.16);color:var(--yellow)}
  .room-state.available{background:rgba(49,91,125,.12);color:var(--muted)}
  .ev-status{display:inline-block;margin-left:5px;padding:1px 4px;border-radius:4px;font-size:clamp(8px,1vmin,11px);letter-spacing:.4px;vertical-align:middle}
  .room-empty{color:var(--rundown-text);font-size:clamp(11px,1.5vmin,15px);font-weight:700;padding:6px 0}
  .brand{display:flex;align-items:center;gap:clamp(8px,1.5vmin,18px);font-size:clamp(20px,3vmin,38px);font-weight:800;color:var(--muted);letter-spacing:clamp(1px,.3vmin,2px)}
  .brand-logo{height:clamp(34px,5.5vmin,64px);width:auto;object-fit:contain}
  body:not(.portrait) .left>div:first-child,
  body:not(.portrait) .weather,
  body:not(.portrait) .verse{flex:0 0 auto}
  body:not(.portrait) .left{gap:clamp(3px,.8vmin,8px);padding-bottom:4px}
  body:not(.portrait) .weather{font-size:clamp(12px,1.5vmin,19px);padding:clamp(5px,1vmin,10px)}
  body:not(.portrait) .verse{margin-top:auto}
  body:not(.portrait) #eventsCard{flex:1 1 0;min-height:0;overflow:auto}
  body.portrait .grid{grid-template-columns:1fr;grid-template-rows:minmax(0,46%) minmax(0,1fr) var(--ticker-h)}
  body.portrait .left{display:grid;grid-template-columns:1fr;
    grid-template-rows:auto auto auto minmax(0,1fr);align-content:start;gap:var(--gap);
    padding:var(--edge);border-right:0;border-bottom:1px solid var(--line);min-height:0;overflow:hidden}
  body.portrait .left>div:first-child{grid-column:1;grid-row:1}
  body.portrait .clock{font-size:clamp(42px,12vmin,92px)}
  body.portrait .date{font-size:clamp(14px,2.8vmin,22px)}
  body.portrait .weather{grid-column:1;grid-row:2;align-self:start;justify-self:start;width:max-content;max-width:100%;
    padding:clamp(6px,1vmin,10px);font-size:clamp(16px,2.1vmin,27px)}
  body.portrait .verse{grid-column:1;grid-row:3;align-self:start;padding:clamp(12px,2.4vmin,20px)}
  body.portrait #eventsCard{grid-column:1;grid-row:4;min-height:0;overflow:auto}
  body.portrait .slide .caption{max-width:90%}
  body.portrait .ticker{grid-column:1/-1}
  @media(max-width:800px){
    .grid{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) var(--ticker-h)}
    body{overflow:hidden;height:100vh;height:100dvh}
    .left{border-right:0;border-bottom:1px solid var(--line)}
  }
  @media(max-width:800px) and (orientation:landscape){
    .grid{grid-template-columns:clamp(210px,26vw,300px) minmax(0,1fr);
      grid-template-rows:minmax(0,1fr) var(--ticker-h)}
    .left{border-bottom:0;border-right:1px solid var(--line)}
    body.portrait .grid{grid-template-columns:1fr;
      grid-template-rows:auto minmax(0,1fr) var(--ticker-h)}
    body.portrait .left{border-bottom:1px solid var(--line);border-right:0}
  }
  @media(min-width:801px) and (orientation:portrait){
    body:not(.portrait) .grid{grid-template-columns:clamp(230px,26vw,420px) minmax(0,1fr);
      grid-template-rows:minmax(0,1fr) var(--ticker-h)}
  }
</style>
</head>
<body>
<div class="grid">
  <div class="left">
    <div>
      <div class="brand"><span class="brand-text">LIFE HOPE CENTER</span><img class="brand-logo" alt="" hidden></div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">...</div>
    </div>
    <div class="weather" id="weather">⏳ Loading weather...</div>
     <div class="cal" id="eventsCard" style="display:none">
       <h3 id="eventsTitle">EVENT RUNDOWN</h3>
       <div class="room-info" id="roomInfo" style="display:none">
         <div class="room-kicker">ROOM OUTPUT</div>
         <div class="room-name" id="roomName"></div>
         <div class="room-state" id="roomState"></div>
       </div>
       <div id="events"></div>
     </div>
    <div class="verse"><span id="verse-text">...</span><b id="verse-ref"></b></div>
  </div>

  <div class="main" id="slideshow"><!-- slides via JS --></div>

  <div class="ticker"><span id="ticker-text"></span></div>
</div>

<script>
/* ============ DEFAULTS (fallback) ============
   Live content comes from the control page (/lhc-events-board/admin) and is stored
   in settings.json. These defaults are used only if the server settings
   cannot be reached. */
const CONFIG = {
  ticker: "Welcome to LIFE HOPE CENTER  •  Sunday Service 9:00 AM  •  Midweek Prayer Wednesday 6PM  •  Press F11 for fullscreen",
  announcements: [
    {title:"Welcome!", sub:"LIFE HOPE CENTER — To God be the glory", cls:"g1"},
    {title:"Sunday Service 9:00 AM", sub:"Bring your family and friends", cls:"g2"},
    {title:"Midweek Prayer — Wed 6PM", sub:"Let us pray together", cls:"g3"},
  ],
  verses: [
    {text:"I am the way, the truth, and the life.", ref:"John 14:6"},
    {text:"The Lord is my shepherd; I shall not want.", ref:"Psalm 23:1"},
    {text:"I can do all things through Christ who strengthens me.", ref:"Philippians 4:13"},
    {text:"Trust in the Lord with all your heart.", ref:"Proverbs 3:5"},
  ],
  slideSeconds: 10,
  weatherLat: 14.2306, weatherLon: 120.9750,
   orientation: "landscape",
   rooms: [],
   outlookIcsUrl: "",
  photoOrder: [],
  photoAnnouncements: {},
  photoFit: {},
  brandName: "LIFE HOPE CENTER",
  brandLogo: "",
  theme: "default",
};
/* Live settings (merged from server on boot) */
let S = JSON.parse(JSON.stringify(CONFIG));
let lastSettings = "";
 let lastBoardHtml = "";
 let ROOM_CONFIG = null;

/* Fetch server settings. Returns raw text for change detection. */
async function fetchSettings(){
  const r = await fetch("/api/lhc-events-board/settings?ts=" + Date.now(), {cache:"no-store"});
  if(!r.ok) return null;
  const txt = await r.text();
  try{
    const j = JSON.parse(txt);
    for(const k of Object.keys(CONFIG)) if(k in j) S[k] = j[k];
  }catch(e){}
  return txt;
}

/* Auto-refresh the TV when the admin saves settings or changes photos */
let lastPhotos = "";
let currentEvents = [];
 const EVENTS_CACHE_KEY = "dakboard-events-v2";
async function fetchBoardHtml(){
  const url = new URL(location.href);
  url.searchParams.set("tv", Date.now());
  const r = await fetch(url, {cache:"no-store"});
  return r.ok ? await r.text() : null;
}

async function checkSettings(){
  try{
    const html = await fetchBoardHtml();
    if(html !== null){
      if(lastBoardHtml && html !== lastBoardHtml){ location.reload(); return; }
      lastBoardHtml = html;
    }
    const txt = await fetchSettings();
    if(txt !== null && lastSettings && txt !== lastSettings){ location.reload(); return; }
    else if(txt !== null) lastSettings = txt;
    const pr = await fetch("/api/lhc-events-board/photos?ts=" + Date.now(), {cache:"no-store"});
    if(pr.ok){
      const pt = await pr.text();
      if(lastPhotos && pt !== lastPhotos){ location.reload(); return; }
      lastPhotos = pt;
    }
  }catch(e){}
}

// Clock (Asia/Manila)
function tick(){
  const now = new Date();
  const opt = {timeZone:"Asia/Manila",hour:"2-digit",minute:"2-digit",hour12:true};
  const dopt = {timeZone:"Asia/Manila",weekday:"long",year:"numeric",month:"long",day:"numeric"};
  document.getElementById("clock").textContent =
    new Intl.DateTimeFormat("en-PH",opt).format(now);
  document.getElementById("date").textContent =
    new Intl.DateTimeFormat("en-PH",dopt).format(now);
}

function manilaDateKey(){
  const parts = new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Manila",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const values = {};
  parts.forEach(p => { if(p.type !== "literal") values[p.type] = p.value; });
  return values.year+"-"+values.month+"-"+values.day;
}

function manilaMonthKey(){
  return manilaDateKey().slice(0,7);
}

function normalizeRoomName(value){
  return String(value || "").trim().replace(/\s+/g, " ").toLowerCase();
}

function roomEntries(){
  const rooms = Array.isArray(S.rooms) ? S.rooms : [];
  return rooms.map(room => {
    if(typeof room === "string") return {name:room.trim(), location:room.trim()};
    if(room && typeof room === "object" && typeof room.name === "string"){
      return {name:room.name.trim(), location:String(room.location || room.name).trim()};
    }
    return null;
  }).filter(room => room && room.name);
}

function resolveRoomConfig(value){
  const wanted = normalizeRoomName(value);
  return roomEntries().find(room => normalizeRoomName(room.name) === wanted)
    || {name:String(value || "").trim(), location:String(value || "").trim()};
}

function eventStatus(event){
  const start = Date.parse(event && event.start || "");
  const end = Date.parse(event && event.end || "");
  const now = Date.now();
  if(Number.isFinite(start) && Number.isFinite(end)){
    if(now >= end) return "ended";
    if(now >= start) return "ongoing";
  }
  return "upcoming";
}

function eventsForRoom(events, room){
  const wanted = normalizeRoomName(room && (room.location || room.name));
  return (events || []).filter(event => event
    && typeof event.location === "string"
    && normalizeRoomName(event.location) === wanted
    && eventStatus(event) !== "ended");
}

function eventsForCurrentMonth(events){
  const month = manilaMonthKey();
  return (events || []).filter(e => e && typeof e.date === "string" && e.date.slice(0,7) === month);
}

function readCachedEvents(){
  try{
    const cached = JSON.parse(localStorage.getItem(EVENTS_CACHE_KEY) || "null");
    if(cached && cached.month === manilaMonthKey()
      && cached.source === (S.outlookIcsUrl || "")
      && Array.isArray(cached.events)) return cached.events;
  }catch(e){}
  return null;
}

function cacheEvents(events){
  try{
    localStorage.setItem(EVENTS_CACHE_KEY, JSON.stringify({
      month: manilaMonthKey(),
      source: S.outlookIcsUrl || "",
      events: events || []
    }));
  }catch(e){}
}

function clearCachedEvents(){
  try{ localStorage.removeItem(EVENTS_CACHE_KEY); }catch(e){}
}

// Verse rotates every 30s
let vi=0;
function verse(){
  const list = (S.verses && S.verses.length) ? S.verses : CONFIG.verses;
  const v=list[vi%list.length];
  const text = v.text || v[0], ref = v.ref || v[1] || "";
  document.getElementById("verse-text").textContent="\u201C"+text+"\u201D";
  document.getElementById("verse-ref").textContent=ref ? "— "+ref : "";
  vi++;
}

// Slideshow: local photos first, fall back to announcement gradients
async function loadSlides(){
  const box=document.getElementById("slideshow");
  let photos=[];
  try{
    const r=await fetch("/api/lhc-events-board/photos");
    if(r.ok) photos=await r.json();
  }catch(e){}
  const brandFile = (S.brandLogo || "").trim();
  if(brandFile) photos = photos.filter(src => src.substring(src.lastIndexOf("/")+1) !== brandFile);
  // order photos as arranged in the control page (▲▼)
  const porder = (S.photoOrder && S.photoOrder.length) ? S.photoOrder : null;
  if(porder){
    const pos = {};
    porder.forEach((n,i)=>{ pos[n]=i; });
    photos = photos.slice().sort((a,b)=>{
      const na = a.substring(a.lastIndexOf("/")+1), nb = b.substring(b.lastIndexOf("/")+1);
      const pa = (na in pos) ? pos[na] : 1e9, pb = (nb in pos) ? pos[nb] : 1e9;
      return (pa-pb) || (na < nb ? -1 : na > nb ? 1 : 0);
    });
  }
  box.innerHTML="";
  const anns = (S.announcements && S.announcements.length) ? S.announcements : CONFIG.announcements;
  const grads = ["g1","g2","g3"];
  const photoAnns = S.photoAnnouncements || {};
  const usedAnns = new Set();
  let slides=photos.map(src=>{
    const name=src.substring(src.lastIndexOf("/")+1);
    const ai=Number(photoAnns[name]);
    const ann=(Number.isInteger(ai) && ai>=0 && ai<anns.length) ? anns[ai] : null;
    if(ann) usedAnns.add(ai);
    return {img:src,title:ann?(ann.title||""):"",sub:ann?(ann.sub||""):"",
      cover:((S.photoFit || {})[name]) !== "contain"};
  });
  anns.forEach((a,i)=>{
    if(!usedAnns.has(i)) slides.push({cls:grads[i%grads.length],title:(a.title||""),sub:(a.sub||"")});
  });
  slides.forEach((s,i)=>{
    const d=document.createElement("div");
    d.className="slide"+(i===0?" active":"");
    if(s.img){
      if(isVideoFile(s.img)){
        const video=document.createElement("video");
        video.muted=true; video.playsInline=true; video.preload="auto";
        video.src=s.img;
        d.appendChild(video);
      }else{
        d.style.setProperty("--photo", "url('"+s.img+"')");
        if(s.cover) d.classList.add("slide-cover");
        else d.classList.add("slide-fit");
        const photo=document.createElement("div");
        photo.className="slide-photo";
        d.appendChild(photo);
      }
    } else d.classList.add(s.cls);
    if(s.title || s.sub){
      const cap=document.createElement("div");
      cap.className="caption";
      if(s.title){
        const h=document.createElement("h2");
        h.textContent=s.title;
        cap.appendChild(h);
      }
      if(s.sub){
        const p=document.createElement("p");
        p.textContent=s.sub;
        cap.appendChild(p);
      }
      d.appendChild(cap);
    }
    box.appendChild(d);
  });
  let cur=0;
  let slideTimer=null;
  function showSlide(i){
    const all=box.querySelectorAll(".slide");
    if(!all.length) return;
    clearTimeout(slideTimer);
    all.forEach(s=>{
      s.classList.remove("active");
      const v=s.querySelector("video");
      if(v){ try{ v.pause(); }catch(e){} v.onended=null; }
    });
    cur=((i%all.length)+all.length)%all.length;
    const active=all[cur];
    active.classList.add("active");
    let wait=(S.slideSeconds||10)*1000;
    const video=active.querySelector("video");
    if(video){
      try{ video.currentTime=0; }catch(e){}
      try{ const p=video.play(); if(p&&typeof p.catch==="function") p.catch(()=>{}); }catch(e){}
      const dur=video.duration;
      if(Number.isFinite(dur)&&dur>0) wait=Math.min(Math.max(dur*1000,1000),60000);
      video.onended=()=>{ clearTimeout(slideTimer); showSlide(cur+1); };
    }
    slideTimer=setTimeout(()=>showSlide(cur+1),wait);
  }
  showSlide(0);
}

function isVideoFile(src){
  const n=String(src||"").toLowerCase();
  return n.endsWith(".mp4")||n.endsWith(".webm");
}

function renderEvents(){
  const card = document.getElementById("eventsCard");
  const box = document.getElementById("events");
  const title = document.getElementById("eventsTitle");
  const roomInfo = document.getElementById("roomInfo");
  const room = ROOM_CONFIG;
  const visible = room ? eventsForRoom(currentEvents, room) : currentEvents
    .filter(e => e && eventStatus(e) !== "ended")
    .sort((a,b) => Date.parse(a.start || 0) - Date.parse(b.start || 0));
  if(room){
    title.textContent = "ROOM SCHEDULE";
    roomInfo.style.display = "";
    document.getElementById("roomName").textContent = room.name;
    const ongoing = visible.find(event => eventStatus(event) === "ongoing");
    const upcoming = visible.find(event => eventStatus(event) === "upcoming");
    const state = document.getElementById("roomState");
    state.className = "room-state " + (ongoing ? "ongoing" : upcoming ? "upcoming" : "available");
    state.textContent = ongoing ? "ONGOING" : upcoming ? "UPCOMING" : "AVAILABLE";
  } else {
    title.textContent = "EVENT RUNDOWN";
    roomInfo.style.display = "none";
  }
  box.innerHTML = "";
  if(!visible.length){
    if(room){
      const empty = document.createElement("div");
      empty.className = "room-empty";
      empty.textContent = "No meeting scheduled";
      box.appendChild(empty);
      card.style.display = "";
    } else {
      card.style.display = "none";
    }
    return;
  }
  const today = manilaDateKey();
  let lastDate = "";
  (room ? visible.slice(0, 8) : visible).forEach(e => {
    if(e.date !== lastDate){
      const date = document.createElement("div");
      date.className = "events-date";
      date.textContent = (e.date === today ? "TODAY • " : "") + (e.day || e.date || "");
      box.appendChild(date);
      lastDate = e.date;
    }
    const d = document.createElement("div");
    d.className = "ev" + (e.date === today ? " today" : "");
    const head = document.createElement("b");
    head.textContent = e.time || (e.allDay ? "All day" : "");
    if(e.date === today){
      const badge = document.createElement("span");
      badge.className = "ev-today";
      badge.textContent = "TODAY";
      head.appendChild(document.createTextNode(" "));
      head.appendChild(badge);
    }
    if(room){
      const status = document.createElement("span");
      const state = eventStatus(e);
      status.className = "ev-status " + state;
      status.textContent = state.toUpperCase();
      head.appendChild(document.createTextNode(" "));
      head.appendChild(status);
    }
    d.appendChild(head);
    d.appendChild(document.createElement("br"));
    const t = document.createElement("div");
    t.className = "ev-name";
    t.textContent = e.title || "";
    d.appendChild(t);
    if(e.location){
      d.appendChild(document.createElement("br"));
      const loc = document.createElement("span");
      loc.className = "loc";
      loc.textContent = e.location;
      d.appendChild(loc);
    }
    box.appendChild(d);
  });
  card.style.display = "";
}

async function loadEvents(){
  const cached = readCachedEvents();
  if(cached && !currentEvents.length){
    currentEvents = cached;
    renderEvents();
  }
  try{
    const r = await fetch("/api/lhc-events-board/events?ts=" + Date.now(), {cache:"no-store"});
    if(!r.ok) return;
    const evs = await r.json();
    currentEvents = Array.isArray(evs) ? evs : [];
    if(currentEvents.length) cacheEvents(currentEvents);
    else clearCachedEvents();
    renderEvents();
  }catch(e){}
}

// Weather (Open-Meteo, free, no key needed)
async function loadWeather(){
  try{
    const u="https://api.open-meteo.com/v1/forecast?latitude="+S.weatherLat+
      "&longitude="+S.weatherLon+"&current=temperature_2m,weather_code&timezone=Asia%2FManila";
    const r=await fetch(u); const j=await r.json();
    const t=Math.round(j.current.temperature_2m);
    const code=j.current.weather_code;
    const desc={0:"Clear ☀️",1:"Mostly clear ⛅",2:"Partly cloudy ⛅",3:"Overcast ☁️",
      45:"Foggy 🌫️",48:"Foggy 🌫️",51:"Drizzle 🌦️",53:"Drizzle 🌦️",55:"Drizzle 🌦️",
      56:"Freezing drizzle 🧊",57:"Freezing drizzle 🧊",
      61:"Rain 🌧️",63:"Rain 🌧️",65:"Heavy rain 🌧️",66:"Freezing rain 🧊",67:"Freezing rain 🧊",
      71:"Snow 🌨️",73:"Snow 🌨️",75:"Heavy snow 🌨️",77:"Snow grains 🌨️",
      80:"Rain showers 🌦️",81:"Rain showers 🌦️",82:"Heavy showers 🌧️",
      85:"Snow showers 🌨️",86:"Snow showers 🌨️",
      95:"Thunderstorm ⛈️",96:"Thunderstorm ⛈️",99:"Thunderstorm ⛈️"}[code]||"Weather code "+code;
    document.getElementById("weather").textContent="🌡️ Silang "+t+"°C — "+desc;
  }catch(e){
    document.getElementById("weather").textContent="🌡️ Weather offline — check internet";
  }
}

/* Boot: load server settings first, then build the board */
(async function boot(){
  try{
    const html = await fetchBoardHtml();
    if(html !== null) lastBoardHtml = html;
  }catch(e){}
  try{
    const txt = await fetchSettings();
    if(txt !== null) lastSettings = txt;
  }catch(e){}
  const roomQuery = new URLSearchParams(location.search).get("room");
  ROOM_CONFIG = roomQuery ? resolveRoomConfig(roomQuery) : null;
  const queryOrientation = new URLSearchParams(location.search).get("orientation");
  const outputOrientation = (queryOrientation === "portrait" || queryOrientation === "landscape")
    ? queryOrientation : S.orientation;
  document.body.classList.toggle("portrait", outputOrientation === "portrait");
  document.getElementById("ticker-text").textContent = S.ticker || CONFIG.ticker;
  document.querySelector(".brand-text").textContent = S.brandName || "LIFE HOPE CENTER";
  document.body.classList.toggle("theme-dark", (S.theme || "default") === "dark");
  if(S.brandLogo){
    const bi = document.querySelector(".brand-logo");
    if(bi){ bi.src = "/photos/" + encodeURIComponent(S.brandLogo); bi.hidden = false; bi.onerror = () => { bi.hidden = true; }; }
  }
  setInterval(tick,1000); tick();
  verse(); setInterval(verse,30000);
  loadSlides();
  try{
    const pr = await fetch("/api/lhc-events-board/photos");
    if(pr.ok) lastPhotos = await pr.text();
  }catch(e){}
  loadWeather(); setInterval(loadWeather, 10*60*1000);
  loadEvents(); setInterval(loadEvents, 30*1000);
  setInterval(checkSettings,2000);
  window.addEventListener("focus", checkSettings);
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden) checkSettings();
  });
})();
