<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Board — Schedule</title>
<style>
  :root{
    --bg:linear-gradient(135deg,#e9a36b 0%,#d8b58b 30%,#8fb69b 60%,#789fbd 100%); --panel:#f5c48b; --panel-2:#b9d6b7; --text:#173b63;
    --muted:#315b7d; --line:#2f8f55; --accent:#1d5687; --success:#3f875f;
    --yellow:#2a6b9b; --red:#a9564e;
  }
  body.theme-dark{--bg:linear-gradient(135deg,#0d1f33 0%,#16324e 60%,#1d3f5c 100%);--panel:#1c3448;--panel-2:#1a3049;--text:#f2e9d8;
    --muted:#cfc4a8;--line:#3f7a52;--accent:#8fc0e8;--success:#5da87e;--yellow:#8fc0e8;--red:#d08a80}
  body.theme-dark .panel{background:linear-gradient(145deg,#1c3448,#14293d)}
  body.theme-dark .next-panel{background:linear-gradient(145deg,#1a3049,#12283c)}
  body.theme-dark .next-panel.rundown-panel,body.theme-dark .upcoming-panel,body.theme-dark .weather-card{background:rgba(30,52,78,.88);color:#f2e9d8}
  body.theme-dark .verse-card{background:rgba(28,62,48,.85);color:#f2e9d8}
  body.theme-dark .ticker{background:rgba(16,30,46,.92);color:#f2e9d8}
  body.theme-dark .events-date,body.theme-dark .ev,body.theme-dark .ev b,body.theme-dark .ev.today b,body.theme-dark .ev .loc,body.theme-dark .ev-name,body.theme-dark .ev-date,body.theme-dark .ev-head,body.theme-dark .ev-title,body.theme-dark .ev-loc{color:#f2e9d8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;min-height:100%;background:var(--bg);color:var(--text)}
  body{font-family:Segoe UI,Arial,sans-serif;overflow:auto}
  .room-screen{min-height:100vh;min-height:100dvh;padding:clamp(18px,3.5vmin,48px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(16px,2.5vmin,30px)}
  .room-header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;border-bottom:2px solid var(--line);padding-bottom:clamp(14px,2.5vmin,28px)}
  .brand{display:flex;align-items:center;gap:clamp(8px,1.5vmin,18px);font-size:clamp(36px,5.4vmin,72px);font-weight:800;letter-spacing:clamp(2px,.5vmin,6px);color:var(--accent)}
  .brand-text{display:flex;flex-direction:column;align-items:stretch;line-height:1.04;text-align:center}
  .brand-bottom{display:flex;justify-content:space-between}
  .brand-logo{height:clamp(64px,10.5vmin,128px);width:auto;object-fit:contain}
  .eyebrow{margin-top:clamp(8px,1.6vmin,18px);font-size:clamp(11px,1.6vmin,18px);letter-spacing:2px;color:var(--muted)}
  .room-name{margin-top:4px;font-size:clamp(30px,6vmin,72px);line-height:1.05;color:var(--text)}
  .time-block{text-align:right;white-space:nowrap}
  .clock{font-size:clamp(40px,7vmin,86px);font-weight:700;line-height:1;color:var(--accent)}
  .date{margin-top:8px;font-size:clamp(14px,2.1vmin,25px);color:var(--muted)}
  .room-main{min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.8fr);gap:clamp(14px,2.5vmin,30px)}
  .panel{min-width:0;min-height:0;overflow:auto;border:2px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--panel),#e5a06c);padding:clamp(18px,3.5vmin,42px)}
  .primary{display:flex;flex-direction:column;justify-content:center;min-height:clamp(280px,48vh,600px);position:relative;overflow:hidden}
  #roomSlides{position:absolute;inset:0;display:none}
  .primary.showing-slides #roomSlides{display:block}
  .room-slide{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-start;
    padding:clamp(18px,3.5vmin,42px);opacity:0;transition:opacity 1s;
    background-image:var(--photo);background-size:cover;background-position:center;background-color:#000}
  .room-slide.room-slide-fit{background-image:none}
  .room-slide.room-slide-cover{background-color:transparent}
  .room-slide::before{content:"";display:block;position:absolute;inset:-6%;background-image:var(--photo);
    background-size:cover;background-position:center;filter:blur(clamp(12px,2.2vmin,28px));
    opacity:.65;z-index:0;pointer-events:none}
  .room-slide.room-slide-cover::before{display:none}
  .room-slide .room-slide-photo{display:block;position:absolute;inset:0;background-image:var(--photo);
    background-size:contain;background-repeat:no-repeat;background-position:center;
    z-index:1;pointer-events:none}
  .room-slide.room-slide-cover .room-slide-photo{display:none}
  .room-slide.active{opacity:1}
  .room-slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;pointer-events:none}
  body.portrait .room-slide video{object-fit:contain}
  .room-slide .caption{position:relative;z-index:2;background:rgba(23,59,99,.82);border:2px solid var(--line);
    padding:clamp(10px,1.8vmin,24px);border-radius:12px;max-width:70%}
  .room-slide .caption h2{font-size:clamp(22px,3.5vmin,40px);margin-bottom:6px;color:#fff4e8}
  .room-slide .caption p{font-size:clamp(12px,2.2vmin,22px);color:#fff4e8}
  .g1{background:linear-gradient(135deg,#e9a36b,#d8b58b)}
  .g2{background:linear-gradient(135deg,#8fb69b,#b9d6b7)}
  .g3{background:linear-gradient(135deg,#789fbd,#a9c9dc)}
  .primary.has-meeting{border-color:rgba(47,143,85,.95);box-shadow:0 0 0 2px rgba(47,143,85,.18),0 18px 60px rgba(0,0,0,.2)}
  .panel-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .panel-label{font-size:clamp(12px,1.7vmin,18px);font-weight:700;letter-spacing:1.5px;color:var(--muted)}
  .status-pill{display:inline-block;border-radius:999px;padding:clamp(5px,.8vmin,9px) clamp(10px,1.5vmin,18px);font-size:clamp(10px,1.3vmin,15px);font-weight:800;letter-spacing:.6px}
  .status-pill.available{background:rgba(49,91,125,.12);color:var(--muted)}
  .status-pill.ongoing{background:rgba(29,86,135,.18);color:var(--accent)}
  .status-pill.upcoming{background:rgba(42,107,155,.16);color:var(--yellow)}
  .meeting-title{margin-top:clamp(18px,3vmin,38px);font-size:clamp(34px,6.2vmin,76px);font-weight:800;line-height:1.12;overflow-wrap:anywhere}
  .range{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:clamp(8px,1.4vmin,18px);margin-top:clamp(22px,4vmin,48px)}
  .range-label{font-size:clamp(12px,1.7vmin,18px);font-weight:800;letter-spacing:1.1px;color:var(--accent)}
  .range-value{font-size:clamp(20px,3.2vmin,38px);font-weight:700;color:var(--text);overflow-wrap:anywhere}
  .range-arrow{font-size:clamp(16px,2.2vmin,26px);color:var(--accent)}
  .meta{margin-top:clamp(16px,2.5vmin,28px);font-size:clamp(14px,2.1vmin,24px);color:var(--muted)}
  .next-panel{display:flex;flex-direction:column;justify-content:center;min-height:clamp(220px,38vh,480px);background:linear-gradient(145deg,var(--panel-2),#a9c9dc)}
  .rundown-panel{justify-content:flex-start;background:rgba(255,230,193,.88);min-height:0}
  .events-date{font-size:clamp(10px,1.35vmin,14px);font-weight:800;color:#1e3f5c;margin:5px 0 2px;letter-spacing:.5px}
  .date-box{border:2px solid var(--line);border-radius:14px;margin:6px 0 8px;background:rgba(255,255,255,.5)}
  .date-box-head{font-size:clamp(10px,1.35vmin,14px);font-weight:800;letter-spacing:.6px;color:#fff4e8;background:var(--accent);padding:5px 12px;border-radius:12px 12px 0 0}
  .date-box-body{padding:2px 12px 6px}
  body.theme-dark .date-box{background:rgba(255,255,255,.07)}
  body.theme-dark .date-box-head{color:#0d1f33;border-radius:12px 12px 0 0}
  .ev{padding:clamp(4px,1vmin,9px) 0;border-top:1px solid var(--line);font-size:clamp(13px,1.8vmin,18px);font-weight:700;color:#1e3f5c}
  .ev b{color:#1e3f5c;font-size:clamp(11px,1.5vmin,16px);font-weight:800}
  .ev.today b{color:#1e3f5c}
  .ev .loc{color:#1e3f5c;font-size:clamp(10px,1.3vmin,14px);font-weight:800}
  .ev-today{display:inline-block;margin-left:5px;padding:1px 4px;border-radius:4px;background:var(--success);color:#fff;font-size:clamp(7px,.9vmin,10px)}
  .ev.ongoing{background:rgba(47,143,85,.16);border-left:3px solid var(--success);padding-left:7px;margin:3px 0}
  .ev-ongoing{display:inline-block;margin-left:5px;padding:1px 4px;border-radius:4px;background:#0d6b34;color:#fff;font-size:clamp(7px,.9vmin,10px);font-weight:800;letter-spacing:.4px}
  .ev-name{font-weight:800;color:#1e3f5c;font-size:clamp(14px,1.9vmin,21px);overflow-wrap:anywhere}
  .rundown-list{display:grid;margin-top:clamp(12px,2vmin,24px);flex:1 1 0;min-height:0;max-height:none;overflow:auto}
  .rundown-list,.rundown-panel,.panel{scrollbar-width:none;-ms-overflow-style:none}
  .rundown-list::-webkit-scrollbar,.rundown-panel::-webkit-scrollbar,.panel::-webkit-scrollbar{display:none}
  .rundown-row{display:grid;grid-template-columns:minmax(74px,.55fr) minmax(0,1.4fr) minmax(96px,.85fr);align-items:center;gap:10px;border-top:2px solid var(--line);padding:10px 0}
  .rundown-row:first-child{border-top:0}
  .rundown-row.is-this-room{background:rgba(79,143,85,.12)}
  .rundown-time{font-size:clamp(12px,1.7vmin,18px);font-weight:800;color:var(--accent);overflow-wrap:anywhere}
  .rundown-name{min-width:0;font-size:clamp(14px,1.9vmin,22px);font-weight:700;overflow-wrap:anywhere}
  .rundown-room{display:flex;min-width:0;flex-direction:column;gap:3px;color:var(--text);font-size:clamp(13px,1.8vmin,21px);font-weight:700}
  .rundown-room-name{overflow-wrap:anywhere}
  .rundown-status{font-size:clamp(11px,1.3vmin,15px);font-weight:800;letter-spacing:.35px;color:var(--yellow)}
  .rundown-status.ongoing{color:var(--accent)}
  .ev-date{font-size:clamp(10px,1.35vmin,15px);font-weight:800;color:#1e3f5c;letter-spacing:.5px;margin:10px 0 2px}
  .ev-date:first-child{margin-top:0}
  .ev-row{padding:clamp(6px,1vmin,10px) 0;border-top:1px solid var(--line)}
  .ev-head{font-size:clamp(13px,1.8vmin,19px);font-weight:800;color:#1e3f5c}
  .ev-badge{display:inline-block;margin-left:5px;padding:1px 5px;border-radius:4px;font-size:clamp(9px,1.1vmin,12px);
    letter-spacing:.4px;background:rgba(42,107,155,.16);color:var(--yellow);vertical-align:middle}
  .ev-badge.ongoing{background:rgba(47,143,85,.18);color:var(--success)}
  .ev-row.ongoing{background:rgba(47,143,85,.14);border-left:3px solid var(--success);padding-left:7px}
  .ev-title{font-size:clamp(14px,1.9vmin,21px);font-weight:800;color:#1e3f5c;overflow-wrap:anywhere}
  .ev-loc{color:#1e3f5c;font-size:clamp(11px,1.4vmin,15px);font-weight:800;overflow-wrap:anywhere}
  .upcoming-panel{min-width:0;border:2px solid var(--line);border-radius:18px;background:rgba(255,230,193,.88);padding:clamp(14px,2.2vmin,28px)}
  .room-message-panel{display:flex;min-height:clamp(110px,16vh,180px);flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .room-status-label{margin-bottom:clamp(6px,1vmin,12px);font-size:clamp(12px,1.7vmin,20px);font-weight:800;letter-spacing:1.5px;color:var(--muted)}
  .room-message-panel.has-meeting{border-color:rgba(47,143,85,.95);box-shadow:0 0 0 2px rgba(47,143,85,.14)}
  .room-message{font-size:clamp(28px,5.5vmin,68px);font-weight:800;letter-spacing:1px;color:var(--accent)}
  .room-message.ongoing{color:var(--accent)}
  .room-message.available{color:var(--accent)}
  .room-message-detail{margin-top:8px;font-size:clamp(15px,2.2vmin,26px);font-weight:700;color:var(--text)}
  .empty{padding:clamp(12px,2vmin,24px) 0;color:var(--muted);font-size:clamp(12px,1.7vmin,20px)}
  .info-row{display:grid;grid-template-columns:1fr;gap:clamp(4px,1vmin,10px)}
  .weather-card{display:flex;align-items:center;min-width:0;border:2px solid var(--line);border-radius:18px;
    background:rgba(255,230,193,.88);padding:clamp(8px,1.2vmin,14px);
    font-size:clamp(12px,1.6vmin,19px);font-weight:700;overflow-wrap:anywhere}
  .time-block .weather-card{width:max-content;margin:8px 0 0 auto;border-width:1px;border-radius:999px;
    padding:clamp(3px,.5vmin,6px) clamp(9px,1.2vmin,14px);font-size:clamp(11px,1.35vmin,15px)}
  .verse-card{min-width:0;border:2px solid var(--line);border-left:6px solid var(--success);border-radius:18px;
    background:rgba(185,214,183,.78);padding:clamp(8px,1.2vmin,14px);
    font-size:clamp(13px,1.8vmin,20px);font-style:italic;overflow-wrap:anywhere}
  .verse-card b{display:block;margin-top:8px;font-style:normal;color:var(--success);font-size:clamp(12px,1.6vmin,18px)}
  .ticker{display:flex;align-items:center;min-width:0;overflow:hidden;border:2px solid var(--line);border-radius:14px;
    background:rgba(143,181,209,.9);padding:clamp(8px,1.4vmin,16px);font-size:clamp(14px,2vmin,24px);font-weight:700}
  .ticker span{white-space:nowrap;padding-left:100%;animation:scroll 30s linear infinite}
  @keyframes scroll{to{transform:translateX(-100%)}}
  .footer{text-align:center;color:var(--muted);font-size:clamp(11px,1.4vmin,16px);letter-spacing:.8px}
  body.portrait .room-screen{max-width:1100px;margin:0 auto;gap:clamp(4px,1vmin,10px)}
  body.portrait .room-header{align-items:flex-start}
  body.portrait .room-main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
  body.design-split.portrait .room-main{grid-template-columns:minmax(0,1.35fr) minmax(280px,.8fr);grid-template-rows:minmax(0,1fr)}
  body.portrait .primary{min-height:360px}
  body.portrait .room-slide .caption{max-width:90%}
  body.portrait .next-panel{min-height:220px}
  body.portrait .info-row{grid-template-columns:1fr}
  body.design-split.portrait .info-row{grid-template-columns:1fr}
  body.design-solo .primary,
  body.design-solo .info-row,
  body.design-solo .footer,
  body.design-solo .ticker{display:none}
  body.design-solo .room-main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  body.design-solo .rundown-panel{overflow:hidden}
  body.design-solo .panel-label{font-size:clamp(16px,2.4vmin,28px);letter-spacing:2.5px}
  body.design-solo .upcoming-count{font-size:clamp(14px,2.1vmin,26px);font-weight:700;color:var(--muted)}
  body.design-solo .events-date{font-size:clamp(16px,2.5vmin,32px);margin:clamp(10px,1.5vmin,18px) 0 4px}
  body.design-solo .rundown-list{align-content:start}
  body.design-solo .ev{font-size:clamp(20px,3.2vmin,40px);padding:clamp(8px,1.2vmin,14px) 0;line-height:1.2}
  body.design-solo .ev b{font-size:clamp(17px,2.6vmin,33px)}
  body.design-solo .ev-name{font-size:clamp(23px,3.7vmin,46px);line-height:1.12}
  body.design-solo .ev .loc{font-size:clamp(15px,2.4vmin,30px);display:block}
  body.design-solo .ev br{display:none}
  body.design-solo .ev .loc{font-size:clamp(15px,2.4vmin,30px)}
  body.design-solo .ev-today,
  body.design-solo .ev-ongoing{font-size:clamp(11px,1.7vmin,21px);padding:2px 9px;border-radius:6px}
  body.design-solo .empty{font-size:clamp(20px,3vmin,36px);font-weight:700;color:var(--muted)}
  @media(max-width:800px){
    .room-screen{padding:16px;gap:16px}
     .room-header{gap:12px}
     .room-name{font-size:clamp(28px,8vw,50px)}
     .clock{font-size:clamp(34px,9vw,60px)}
     .date{font-size:14px}
     .room-main{grid-template-columns:1fr;grid-template-rows:auto auto}
      .primary{min-height:360px}
      .room-slide .caption{max-width:90%}
     .next-panel{min-height:220px}
     .info-row{grid-template-columns:1fr}
     .room-message{font-size:clamp(26px,9vw,52px)}
  }
</style>
</head>
<body>
<div class="room-screen">
  <header class="room-header">
    <div>
      <div class="brand"><img class="brand-logo" alt="" hidden><span class="brand-text">EVENT BOARD</span></div>
    </div>
    <div class="time-block">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">...</div>
      <div class="weather-card" id="weather">⏳ Loading weather...</div>
    </div>
  </header>

  <main class="room-main">
     <section class="panel primary showing-slides" id="currentPanel">
       <div id="roomSlides"></div>
     </section>

    <section class="panel next-panel rundown-panel">
      <div class="panel-top">
        <div class="panel-label">EVENT RUNDOWN</div>
        <div class="upcoming-count" id="rundownCount">0 scheduled</div>
      </div>
      <div class="rundown-list" id="rundownList"></div>
    </section>
  </main>

  <section class="info-row">
    <div class="verse-card"><span id="verse-text">...</span><b id="verse-ref"></b></div>
  </section>

  <footer class="footer"></footer>

  <div class="ticker"><span id="ticker-text"></span></div>
</div>
<script>
const query = new URLSearchParams(location.search);
let settings = {rooms:[]};
let currentEvents = [];
let lastSettings = "";
let lastRoomHtml = "";
let lastPhotos = "";
document.body.classList.toggle("portrait", query.get("orientation") === "portrait");
document.body.classList.toggle("design-solo", query.get("design") === "solo");
const soloMode = query.get("design") === "solo";

function tick(){
  const now = new Date();
  document.getElementById("clock").textContent = new Intl.DateTimeFormat("en-PH", {
    timeZone:"Asia/Manila", hour:"numeric", minute:"2-digit", hour12:true
  }).format(now);
  document.getElementById("date").textContent = new Intl.DateTimeFormat("en-PH", {
    timeZone:"Asia/Manila", weekday:"long", month:"long", day:"numeric", year:"numeric"
  }).format(now);
}

const DEFAULT_VERSES = [
  {text:"I am the way, the truth, and the life.", ref:"John 14:6"},
  {text:"The Lord is my shepherd; I shall not want.", ref:"Psalm 23:1"},
  {text:"I can do all things through Christ who strengthens me.", ref:"Philippians 4:13"},
  {text:"Trust in the Lord with all your heart.", ref:"Proverbs 3:5"}
];

let vi = 0;
function verse(){
  const list = (Array.isArray(settings.verses) && settings.verses.length) ? settings.verses : DEFAULT_VERSES;
  const v = list[vi % list.length];
  const text = v.text || v[0] || "", ref = v.ref || v[1] || "";
  document.getElementById("verse-text").textContent = "\u201C" + text + "\u201D";
  document.getElementById("verse-ref").textContent = ref ? "— " + ref : "";
  vi++;
}

async function loadWeather(){
  try{
    const lat = Number(settings.weatherLat) || 14.2306;
    const lon = Number(settings.weatherLon) || 120.9750;
    const u = "https://api.open-meteo.com/v1/forecast?latitude=" + lat +
      "&longitude=" + lon + "&current=temperature_2m,weather_code&timezone=Asia%2FManila";
    const r = await fetch(u); const j = await r.json();
    const t = Math.round(j.current.temperature_2m);
    const code = j.current.weather_code;
    const desc = {0:"Clear ☀️",1:"Mostly clear ⛅",2:"Partly cloudy ⛅",3:"Overcast ☁️",
      45:"Foggy 🌫️",48:"Foggy 🌫️",51:"Drizzle 🌦️",53:"Drizzle 🌦️",55:"Drizzle 🌦️",
      56:"Freezing drizzle 🧊",57:"Freezing drizzle 🧊",
      61:"Rain 🌧️",63:"Rain 🌧️",65:"Heavy rain 🌧️",66:"Freezing rain 🧊",67:"Freezing rain 🧊",
      71:"Snow 🌨️",73:"Snow 🌨️",75:"Heavy snow 🌨️",77:"Snow grains 🌨️",
      80:"Rain showers 🌦️",81:"Rain showers 🌦️",82:"Heavy showers 🌧️",
      85:"Snow showers 🌨️",86:"Snow showers 🌨️",
      95:"Thunderstorm ⛈️",96:"Thunderstorm ⛈️",99:"Thunderstorm ⛈️"}[code] || "Weather code " + code;
    document.getElementById("weather").textContent = "🌡️ Silang " + t + "°C — " + desc;
  }catch(e){
    document.getElementById("weather").textContent = "🌡️ Weather offline — check internet";
  }
}

function eventStatus(event){
  const start = Date.parse(event && event.start || "");
  const end = Date.parse(event && event.end || "");
  const now = Date.now();
  if(Number.isFinite(start) && Number.isFinite(end)){
    if(now >= end) return "ended";
    if(now >= start) return "ongoing";
  }
  return "upcoming";
}

function formatDate(value){
  return new Intl.DateTimeFormat("en-PH", {
    timeZone:"Asia/Manila", weekday:"short", month:"short", day:"numeric"
  }).format(new Date(value));
}

function formatTime(value){
  return new Intl.DateTimeFormat("en-PH", {
    timeZone:"Asia/Manila", hour:"numeric", minute:"2-digit", hour12:true
  }).format(new Date(value));
}

function sameManilaDate(first, second){
  const options = {timeZone:"Asia/Manila", year:"numeric", month:"2-digit", day:"2-digit"};
  return new Intl.DateTimeFormat("en-CA", options).format(new Date(first))
    === new Intl.DateTimeFormat("en-CA", options).format(new Date(second));
}

function momentLabel(value, other){
  const time = formatTime(value);
  return sameManilaDate(value, other) ? time : formatDate(value) + " " + time;
}

function timeRange(event){
  const s = Date.parse(event.start || ""), e = Date.parse(event.end || "");
  const base = event.time || (event.allDay ? "All day" : momentLabel(event.start, event.end));
  if(event.allDay || !Number.isFinite(s) || !Number.isFinite(e) || e <= s) return base;
  const endLabel = sameManilaDate(s, e) ? formatTime(event.end)
    : (formatDate(event.end) + " " + formatTime(event.end));
  return base + " – " + endLabel;
}

function scheduledEvents(){
  return currentEvents
    .filter(event => event && eventStatus(event) !== "ended")
    .sort((a, b) => Date.parse(a.start || 0) - Date.parse(b.start || 0));
}

function manilaDateKey(){
  const parts = new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Manila",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const values = {};
  parts.forEach(p => { if(p.type !== "literal") values[p.type] = p.value; });
  return values.year+"-"+values.month+"-"+values.day;
}

function renderRundownClassic(events){
  const rundown = document.getElementById("rundownList");
  const count = document.getElementById("rundownCount");
  const keepScroll = rundown.scrollTop;
  rundown.replaceChildren();
  count.textContent = events.length + " scheduled";
  if(!events.length){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No upcoming meetings";
    rundown.appendChild(empty);
    return;
  }
  const today = manilaDateKey();
  let lastDate = "";
  let dateBody = null;
  events.slice(0, 25).forEach(event => {
    const eDate = event.date || "";
    if(!soloMode && eDate && eDate !== lastDate){
      const boxEl = document.createElement("div");
      boxEl.className = "date-box";
      const date = document.createElement("div");
      date.className = "date-box-head";
      date.textContent = (eDate === today ? "TODAY • " : "") + (event.day || event.date || "");
      dateBody = document.createElement("div");
      dateBody.className = "date-box-body";
      boxEl.append(date, dateBody);
      rundown.appendChild(boxEl);
      lastDate = eDate;
    }
    const d = document.createElement("div");
    const isOngoing = !event.allDay && eventStatus(event) === "ongoing";
    d.className = "ev" + (eDate === today ? " today" : "") + (isOngoing ? " ongoing" : "");
    const head = document.createElement("b");
    const baseTime = timeRange(event);
    head.textContent = (soloMode && eDate !== today && event.day)
      ? (event.day + " · " + baseTime) : baseTime;
    if(eDate === today){
      const badge = document.createElement("span");
      badge.className = "ev-today";
      badge.textContent = "TODAY";
      head.appendChild(document.createTextNode(" "));
      head.appendChild(badge);
    }
    if(isOngoing){
      const badge = document.createElement("span");
      badge.className = "ev-ongoing";
      badge.textContent = "ON-GOING";
      head.appendChild(document.createTextNode(" "));
      head.appendChild(badge);
    }
    d.appendChild(head);
    d.appendChild(document.createElement("br"));
    const t = document.createElement("div");
    t.className = "ev-name";
    t.textContent = event.title || "Untitled meeting";
    d.appendChild(t);
    if(event.location){
      d.appendChild(document.createElement("br"));
      const loc = document.createElement("span");
      loc.className = "loc";
      loc.textContent = event.location;
      d.appendChild(loc);
    }
    (dateBody || rundown).appendChild(d);
  });
  rundown.scrollTop = keepScroll;
}

function renderRundown(events){
  if(soloMode || (settings.outputDesign || "classic") !== "split"){
    renderRundownClassic(events);
    return;
  }
  const rundown = document.getElementById("rundownList");
  const count = document.getElementById("rundownCount");
  rundown.replaceChildren();
  count.textContent = events.length + " scheduled";
  if(!events.length){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No upcoming meetings";
    rundown.appendChild(empty);
    return;
  }
  const today = manilaDateKey();
  let lastDate = "";
  let dateBody = null;
  events.slice(0, 25).forEach(event => {
    if(event.date && event.date !== lastDate){
      const boxEl = document.createElement("div");
      boxEl.className = "date-box";
      const date = document.createElement("div");
      date.className = "date-box-head";
      date.textContent = (event.date === today ? "TODAY • " : "") + (event.day || formatDate(event.start));
      dateBody = document.createElement("div");
      dateBody.className = "date-box-body";
      boxEl.append(date, dateBody);
      rundown.appendChild(boxEl);
      lastDate = event.date;
    }
    const statusValue = eventStatus(event);
    const isOngoing = !event.allDay && statusValue === "ongoing";
    const row = document.createElement("div");
    row.className = "ev-row" + (isOngoing ? " ongoing" : "");
    const head = document.createElement("div");
    head.className = "ev-head";
    head.textContent = event.allDay ? "ALL DAY" : timeRange(event);
    const badge = document.createElement("span");
    badge.className = "ev-badge" + (isOngoing ? " ongoing" : "");
    badge.textContent = isOngoing ? "ON-GOING" : "UPCOMING";
    head.appendChild(document.createTextNode(" "));
    head.appendChild(badge);
    const name = document.createElement("div");
    name.className = "ev-title";
    name.textContent = event.title || "Untitled meeting";
    const loc = document.createElement("div");
    loc.className = "ev-loc";
    loc.textContent = event.location || "Unassigned";
    row.append(head, name, loc);
    (dateBody || rundown).appendChild(row);
  });
}

async function fetchSettings(){
  try{
    const response = await fetch("/api/event-board/settings?ts=" + Date.now(), {cache:"no-store"});
    if(!response.ok) return null;
    const text = await response.text();
    try{ settings = JSON.parse(text); }catch(e){}
    return text;
  }catch(e){ return null; }
}

async function loadEvents(){
  try{
    const response = await fetch("/api/event-board/events?ts=" + Date.now(), {cache:"no-store"});
    if(!response.ok) return;
    const data = await response.json();
    currentEvents = Array.isArray(data) ? data : [];
    renderRundown(scheduledEvents());
  }catch(e){}
}

// Slideshow (same photos and announcements as the main board).
// Shown in the main panel whenever this room has no on-going meeting.
let roomHasSlides = false;
let roomSlidesTimer = null;

async function loadRoomSlides(){
  const box = document.getElementById("roomSlides");
  let photos = [];
  try{
    const response = await fetch("/api/event-board/photos");
    if(response.ok) photos = await response.json();
  }catch(e){}
  const brandFile = (settings.brandLogo || "").trim();
  if(brandFile) photos = photos.filter(src => src.substring(src.lastIndexOf("/") + 1) !== brandFile);
  const porder = (settings.photoOrder && settings.photoOrder.length) ? settings.photoOrder : null;
  if(porder){
    const pos = {};
    porder.forEach((name, i) => { pos[name] = i; });
    photos = photos.slice().sort((a, b) => {
      const na = a.substring(a.lastIndexOf("/") + 1), nb = b.substring(b.lastIndexOf("/") + 1);
      const pa = (na in pos) ? pos[na] : 1e9, pb = (nb in pos) ? pos[nb] : 1e9;
      return (pa - pb) || (na < nb ? -1 : na > nb ? 1 : 0);
    });
  }
  box.innerHTML = "";
  const anns = Array.isArray(settings.announcements) && settings.announcements.length ? settings.announcements : [];
  const grads = ["g1", "g2", "g3"];
  const photoAnns = settings.photoAnnouncements || {};
  const usedAnns = new Set();
  const slides = photos.map(src => {
    const name = src.substring(src.lastIndexOf("/") + 1);
    const ai = Number(photoAnns[name]);
    const ann = (Number.isInteger(ai) && ai >= 0 && ai < anns.length) ? anns[ai] : null;
    if(ann) usedAnns.add(ai);
    return {img:src, title:ann ? (ann.title || "") : "", sub:ann ? (ann.sub || "") : "",
      cover:((settings.photoFit || {})[name]) !== "contain"};
  });
  anns.forEach((a, i) => {
    if(!usedAnns.has(i)) slides.push({cls:grads[i % grads.length], title:(a.title || ""), sub:(a.sub || "")});
  });
  slides.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "room-slide" + (i === 0 ? " active" : "");
    if(s.img){
      if(isVideoFile(s.img)){
        const video = document.createElement("video");
        video.muted = true; video.playsInline = true; video.preload = "auto";
        video.src = s.img;
        d.appendChild(video);
      }else{
        d.style.setProperty("--photo", "url('" + s.img + "')");
        if(s.cover) d.classList.add("room-slide-cover");
        else d.classList.add("room-slide-fit");
        const photo = document.createElement("div");
        photo.className = "room-slide-photo";
        d.appendChild(photo);
      }
    }
    else d.classList.add(s.cls);
    if(s.title || s.sub){
      const cap = document.createElement("div");
      cap.className = "caption";
      if(s.title){
        const h = document.createElement("h2");
        h.textContent = s.title;
        cap.appendChild(h);
      }
      if(s.sub){
        const p = document.createElement("p");
        p.textContent = s.sub;
        cap.appendChild(p);
      }
      d.appendChild(cap);
    }
    box.appendChild(d);
  });
  roomHasSlides = slides.length > 0;
  if(roomSlidesTimer) clearTimeout(roomSlidesTimer);
  let cur = 0;
  function showRoomSlide(i){
    const all = box.querySelectorAll(".room-slide");
    if(!all.length) return;
    all.forEach(s => {
      s.classList.remove("active");
      const v = s.querySelector("video");
      if(v){ try{ v.pause(); }catch(e){} v.onended = null; }
    });
    cur = ((i % all.length) + all.length) % all.length;
    const active = all[cur];
    active.classList.add("active");
    let wait = (settings.slideSeconds || 10) * 1000;
    const video = active.querySelector("video");
    if(video){
      try{ video.currentTime = 0; }catch(e){}
      try{ const p = video.play(); if(p && typeof p.catch === "function") p.catch(()=>{}); }catch(e){}
      const dur = video.duration;
      if(Number.isFinite(dur) && dur > 0) wait = Math.min(Math.max(dur * 1000, 1000), 60000);
      video.onended = () => { clearTimeout(roomSlidesTimer); showRoomSlide(cur + 1); };
    }
    roomSlidesTimer = setTimeout(() => showRoomSlide(cur + 1), wait);
  }
  showRoomSlide(0);
  renderRundown(scheduledEvents());
}

function isVideoFile(src){
  const n = String(src || "").toLowerCase();
  return n.endsWith(".mp4") || n.endsWith(".webm");
}

async function fetchRoomHtml(){
  try{
    const url = new URL(location.href);
    url.searchParams.set("tv", Date.now());
    const response = await fetch(url, {cache:"no-store"});
    return response.ok ? await response.text() : null;
  }catch(e){ return null; }
}

async function checkSettings(){
  const html = await fetchRoomHtml();
  if(html !== null){
    if(lastRoomHtml && html !== lastRoomHtml){
      location.reload();
      return;
    }
    lastRoomHtml = html;
  }
  const text = await fetchSettings();
  if(text !== null && lastSettings && text !== lastSettings){
    location.reload();
    return;
  }
  if(text !== null) lastSettings = text;
  try{
    const response = await fetch("/api/event-board/photos?ts=" + Date.now(), {cache:"no-store"});
    if(response.ok){
      const photosText = await response.text();
      if(lastPhotos && photosText !== lastPhotos){
        location.reload();
        return;
      }
      lastPhotos = photosText;
    }
  }catch(e){}
}

/* Brand name: last word letters spread edge-to-edge under the top line */
function setBrandName(el, name){
  const words = (name || "EVENT BOARD").trim().split(/\s+/);
  el.replaceChildren();
  if(words.length >= 2){
    const top = document.createElement("span");
    top.className = "brand-top";
    top.textContent = words.slice(0, -1).join(" ");
    const bottom = document.createElement("span");
    bottom.className = "brand-bottom";
    for(const ch of words[words.length - 1]){
      const s = document.createElement("span");
      s.textContent = ch;
      bottom.appendChild(s);
    }
    el.append(top, bottom);
  }else{
    el.textContent = words[0] || "";
  }
}

async function boot(){
  tick();
  setInterval(tick, 1000);
  const text = await fetchSettings();
  if(text !== null) lastSettings = text;
  document.body.classList.toggle("design-split", settings.outputDesign === "split");
  document.getElementById("ticker-text").textContent = settings.ticker || "Welcome to EVENT BOARD";
  setBrandName(document.querySelector(".brand-text"), settings.brandName || "EVENT BOARD");
  document.body.classList.toggle("theme-dark", ((settings && settings.theme) || "default") === "dark");
  if(settings.brandLogo){
    const bi = document.querySelector(".brand-logo");
    if(bi){ bi.src = "/photos/" + encodeURIComponent(settings.brandLogo); bi.hidden = false; bi.onerror = () => { bi.hidden = true; }; }
  }
  verse();
  setInterval(verse, 30000);
  loadWeather();
  setInterval(loadWeather, 10 * 60 * 1000);
  await loadEvents();
  if(!soloMode) await loadRoomSlides();
  const html = await fetchRoomHtml();
  if(html !== null) lastRoomHtml = html;
  try{
    const response = await fetch("/api/event-board/photos?ts=" + Date.now(), {cache:"no-store"});
    if(response.ok) lastPhotos = await response.text();
  }catch(e){}
  setInterval(loadEvents, 30000);
  setInterval(checkSettings, 2000);
  function checkDeviceRoute(){
    fetch("/api/event-board/device-route?ts="+Date.now(),{cache:"no-store"})
      .then(r => r.ok ? r.json() : null)
      .then(j => { if(j && j.target && j.target !== location.pathname + location.search) location.replace(j.target); })
      .catch(() => {});
  }
  setInterval(checkDeviceRoute, 2000);
  checkDeviceRoute();
  window.addEventListener("focus", checkSettings);
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden) checkSettings();
  });
}

boot();
