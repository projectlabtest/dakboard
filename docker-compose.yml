services:
  event-board:
    build: .
    image: event-board:latest
    container_name: event-board
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      EVENT_BOARD_ADMIN_USERNAME: ${EVENT_BOARD_ADMIN_USERNAME:-admin}
      EVENT_BOARD_ADMIN_PASSWORD: ${EVENT_BOARD_ADMIN_PASSWORD:?Set EVENT_BOARD_ADMIN_PASSWORD in .env}
      EVENT_BOARD_EDITOR_PASSWORD: ${EVENT_BOARD_EDITOR_PASSWORD:-}
    volumes:
      - event-board-data:/data

volumes:
  event-board-data:
